<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SalesAgent Hilfebereich">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#BFA37C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#BFA37C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Eyebrow -->
  <text x="96" y="200" font-family="Geist, system-ui, sans-serif" font-size="22" font-weight="500"
        fill="#8C7754" letter-spacing="4">SALESAGENT · HILFEBEREICH</text>

  <!-- Headline -->
  <text x="96" y="370" font-family="Geist, system-ui, sans-serif" font-size="148" font-weight="600"
        fill="#F5F1E8" letter-spacing="-6">Frag Sandy<tspan fill="#E5D0A5">.</tspan></text>

  <!-- Subline -->
  <text x="96" y="450" font-family="Geist, system-ui, sans-serif" font-size="32" font-weight="400"
        fill="#B8B0A0" letter-spacing="-1">Antworten zu Abrechnung, Onboarding und Vertrag.</text>

  <!-- URL -->
  <text x="96" y="560" font-family="Geist Mono, ui-monospace, monospace" font-size="22" font-weight="500"
        fill="#BFA37C" letter-spacing="0">help.salesagent.at</text>
</svg>
